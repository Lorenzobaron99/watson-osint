# Watson OSINT — Docker Compose
#
# Services:
#   watson-api    — FastAPI server (port 8777)
#   redis         — Caching, rate limiting, message broker
#   neo4j         — Knowledge graph (entities + relationships)
#   nats          — Message bus for agent communication

version: "3.9"

services:
  # ── Watson API ────────────────────────────────────────────
  watson-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: watson-api
    ports:
      - "8777:8777"
    environment:
      # Server
      - WATSON_PORT=8777
      - WATSON_HOST=0.0.0.0
      - WATSON_API_KEY=${WATSON_API_KEY:-watson-dev-key-change-me}

      # API keys
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}

      # Infrastructure
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-watson123}
      - NATS_URL=nats://nats:4222

      # Persistence
      - WATSON_DB_PATH=/data/investigations.db
      - WATSON_CASES_DIR=/data/cases

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - watson_data:/data
      - ./cases:/data/cases
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8777/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: watson-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── Neo4j ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: watson-neo4j
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-watson123}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── NATS ──────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: watson-nats
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # HTTP monitoring
    command: >
      --http_port 8222
      --max_payload 8MB
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8222/healthz", "-O", "/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  watson_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
