[project]
name = "osintengine"
version = "1.0.8"
description = "The OSINT investigation engine — 7-phase pipeline, persistent knowledge graph, community intelligence"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Lorenzo Baron", email = "baron.lorenzo99@gmail.com"}]
keywords = ["osint", "investigation", "intelligence", "graph", "open-source", "due-diligence", "security", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "httpx>=0.26",
    "ddgs>=5.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/Lorenzobaron99/watson-osint"
Documentation = "https://github.com/Lorenzobaron99/watson-osint#readme"
"Bug Tracker" = "https://github.com/Lorenzobaron99/watson-osint/issues"
Repository = "https://github.com/Lorenzobaron99/watson-osint"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.0",
]
web = [
    # Already in core — this group exists for clarity
]
tools = [
    "dnspython>=2.6",
    "fpdf2>=2.7",
    "playwright>=1.40",
    "Pillow>=10.0",
]
full = [
    "dnspython>=2.6",
    "fpdf2>=2.7",
    "playwright>=1.40",
    "Pillow>=10.0",
    "gliner>=0.2",
    "neo4j>=5.0",
    "redis>=5.0",
    "certifi>=2024",
    "spacy>=3.7",
    "en-core-web-md>=3.7",
]
ner = [
    "spacy>=3.7",
    "en-core-web-md>=3.7",
]

[project.scripts]
watson = "watson.cli:main_entry"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    # Root watson/ — web app, CLI, toolkit
    "watson",
    "watson.agents",
    "watson.opsec",
    "watson.serializers",
    "watson.verification",
    "watson.web",
    # src/watson/ — core engine
    "src",
    "src.watson",
    "src.watson.agent",
    "src.watson.agents",
    "src.watson.auth",
    "src.watson.core",
    "src.watson.graph",
    "src.watson.infra",
    "src.watson.opsec",
    "src.watson.orchestration",
    "src.watson.persistence",
    "src.watson.pipeline",
    "src.watson.tools",
    "src.watson.utils",
    "src.watson.verification",
]

[tool.setuptools.package-dir]
"watson" = "watson"
"src" = "src"
"src.watson" = "src/watson"

[tool.setuptools.package-data]
"watson" = ["web/static/**/*", "web/templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
